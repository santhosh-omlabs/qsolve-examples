schema_version: 1
name: electrolyte-solvent-screen
version: 1.0.1
family: electronic_structure
summary: Rank battery-electrolyte solvents by how strongly they bind Li+ (EC, FEC, DMC, DME, THF, acetonitrile, water or your own), with each binding energy computed by VQE and checked against exact and MP2 references
license: Apache-2.0
tags: [chemistry, vqe, battery, electrolyte, lithium-ion, solvation, screening]

inputs:
  schema: schemas/input.json
  examples: [examples/carbonates_vs_ethers.json, examples/quick_preview.json]
parameters:
  - {name: shots, label: Shots per circuit, type: int, default: 50000, min: 1000, max: 1000000, description: "Shots per measurement circuit; error bars shrink as 1/sqrt(shots)"}
  - {name: optimizer_iters, label: Optimiser iterations, type: int, default: 200, min: 5, max: 2000, description: Optimizer iterations (noise-free training)}
  - {name: ansatz, label: Ansatz, type: enum, default: uccsd, choices: [uccsd, hea], description: "uccsd is chemically exact for these active spaces; hea is experimental"}
outputs:
  schema: schemas/output.json

# The class that implements the methods below. It is plain Qiskit.
entrypoint: src.workflow:ElectrolyteSolventScreen

category: Batteries and materials
objective: {label: Combined binding energy, unit: "Ha", decimals: 6}
metric: {kind: relative_error, note: "1 minus the energy difference to the exact active-space answer, as a fraction of that answer. Total energies are large numbers, so read the error in mHa too: chemical accuracy is 1.6 mHa."}
methods:
  - id: vqe
    role: quantum
    title: VQE (variational quantum eigensolver)
    what: Prepares a trial quantum state of the electrons and adjusts it until its measured energy is as low as possible.
    strength: Computes molecular energies without storing the full wavefunction.
    limit: Needs many measurements, and noise limits the size of molecule.
  - id: casci
    role: reference
    title: Exact solution in the active space (CASCI)
    what: Solves the electron equation exactly, but only for a chosen set of orbitals (the active space), the same set the quantum computer works on.
    strength: Exact for that space, so it is the fair target for the quantum result.
    limit: Ignores the orbitals outside the active space.
  - id: hartree-fock
    role: classical
    title: Hartree-Fock
    what: Treats every electron as moving in the average field of all the others.
    strength: Cheap, and the starting point of almost all chemistry methods.
    limit: Misses electron correlation, a small share of the energy that decides most chemistry.
  - id: mp2
    role: classical
    title: Second-order perturbation theory (MP2)
    what: Starts from Hartree-Fock and adds a first correction for how electrons avoid each other.
    strength: A quick, widely used improvement over Hartree-Fock.
    limit: Can be unreliable for stretched bonds and metals.
  - id: ccsd-t
    role: classical
    title: Coupled cluster, CCSD(T)
    what: Builds the wavefunction from single and double electron excitations, plus an estimate of triple ones.
    strength: The gold standard of everyday quantum chemistry.
    limit: Cost grows steeply with molecule size.

envelope:
  max_qubits: 12
  max_variables: 12
  notes: "Up to 8 solvents per run; each system uses at most 6 active orbitals (12 qubits)"

targets:
  simulators: [cpu, gpu]
  qpu: [ibm]
  min_qubits_qpu: 4

resources:
  timeout_s: 7200
  memory_mb: 4096
  network: none

runtime:
  python: "3.12"
  dependencies: requirements.lock
