cases:
  - name: ring-6-with-chord
    input_file: examples/ring_6.json
    seed: 1
    expect: {max_gap: 0.0}
  - name: complete-graph-8
    input:
      nodes: [n0, n1, n2, n3, n4, n5, n6, n7]
      edges: [[n0,n1],[n0,n2],[n0,n3],[n0,n4],[n0,n5],[n0,n6],[n0,n7],[n1,n2],[n1,n3],[n1,n4],[n1,n5],[n1,n6],[n1,n7],[n2,n3],[n2,n4],[n2,n5],[n2,n6],[n2,n7],[n3,n4],[n3,n5],[n3,n6],[n3,n7],[n4,n5],[n4,n6],[n4,n7],[n5,n6],[n5,n7],[n6,n7]]
    seed: 2
    expect: {max_gap: 0.0}
  - name: weighted-petersen-10
    input:
      nodes: [p0, p1, p2, p3, p4, p5, p6, p7, p8, p9]
      edges: [[p0,p1,1],[p1,p2,2],[p2,p3,1],[p3,p4,3],[p4,p0,1],[p0,p5,2],[p1,p6,1],[p2,p7,1],[p3,p8,2],[p4,p9,1],[p5,p7,1],[p7,p9,2],[p9,p6,1],[p6,p8,1],[p8,p5,2]]
    seed: 3
    expect: {max_gap: 0.0}
  - name: regular-3-weighted-18
    input_file: benchmarks/inputs/regular-3-weighted-18.json
    seed: 1
    expect: {max_gap: 0.0}
  - name: regular-3-weighted-20
    input_file: benchmarks/inputs/regular-3-weighted-20.json
    seed: 1
    expect: {max_gap: 0.0}
  - name: noise-model-ring-6
    input_file: examples/ring_6.json
    target: fake:fez@1.6   # ibm_fez noise model at 1.6x (what the chip measured vs its own model)
    seed: 1
    expect: {max_gap: 0.0, min_fidelity: 0.97, max_two_qubit_gates: 40}
