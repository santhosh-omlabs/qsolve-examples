# Every example workflow is linted, unit-tested and run through the SDK's validation gates, as the
# Qsolve platform will run them. The SDK is the public bridge, checked out next to this repository;
# One thread keeps floating-point results exactly reproducible, as in the platform's runtime image.
# The electrolyte screen's gates take about 25 minutes, so they run on main only; its lint and unit
# tests run on every push.
name: ci
on: [push, pull_request]
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - portfolio-optimization
          - max-cut
          - generic-qubo
          - molecular-ground-state
          - interaction-energy
          - quantum-kernel-classifier
          - electrolyte-solvent-screen
    steps:
      - uses: actions/checkout@v4
        with: { path: examples }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/qsolve-sdk", path: qsolve-sdk }
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install "./qsolve-sdk[ibm]" scipy scikit-learn qiskit-aer pyscf pytest
      - run: uv run qsolve validate examples/${{ matrix.workflow }}
      - run: uv run qsolve lint examples/${{ matrix.workflow }}
      - run: uv run pytest -q examples/${{ matrix.workflow }}/tests
        if: hashFiles(format('examples/{0}/tests', matrix.workflow)) != ''
      - run: uv run qsolve test examples/${{ matrix.workflow }}
        if: matrix.workflow != 'electrolyte-solvent-screen' || github.ref == 'refs/heads/main'
